# ==============================================================================
# SmartRoute — Application Configuration
# Anurag University Transport & Bus Pass Management System
# ==============================================================================

# ==============================================================================
# 1. General Server Configuration
# ==============================================================================
server:
  port: ${PORT:8085}
  servlet:
    context-path: /api
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: always

# ==============================================================================
# 2. Application Information & Core Spring Services
# ==============================================================================
spring:
  application:
    name: smartroute

  # ----------------------------------------------------------------------------
  # 3. Database Configuration — Aiven MySQL in Production
  # ----------------------------------------------------------------------------
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smartroute?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:smartroute}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000
      keepalive-time: 30000
      leak-detection-threshold: 60000

  # ----------------------------------------------------------------------------
  # 4. JPA and Hibernate
  # ----------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 20
          fetch_size: 50
          order_inserts: true
          order_updates: true

  # ----------------------------------------------------------------------------
  # 5. Database Migrations
  # ----------------------------------------------------------------------------
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations:
      - classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "1"
    validate-on-migrate: true
    out-of-order: false

  # ----------------------------------------------------------------------------
  # Email, Uploads & Web Services
  # ----------------------------------------------------------------------------
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  security:
    filter:
      order: 100

  json:
    serialization:
      write-dates-as-timestamps: false

  web:
    resources:
      chain:
        cache: true
      cache:
        period: 3600

# ==============================================================================
# 6. Monitoring and Health Checks
# ==============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

# ==============================================================================
# 7. API Documentation
# ==============================================================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    display-request-duration: true
  packages-to-scan: com.anuraguniversity.smartroute

# ==============================================================================
# 8. SmartRoute Security and CORS
# ==============================================================================
smartroute:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,https://smart-route-jet.vercel.app}

  jwt:
    secret: ${JWT_SECRET:}
    expiration: 86400000
    refresh-expiration: 604800000

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:${MAIL_USERNAME:noreply@anuraguniversity.edu.in}}

  otp:
    require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:false}
    length: 6
    expiration-minutes: 10
    max-attempts: 3
    resend-cooldown-seconds: 60
    rate-limit-per-hour: 5

  rate-limit:
    login:
      max-attempts: 5
      window-minutes: 15
    password-reset:
      max-attempts: 3
      window-minutes: 60

  transport:
    workbook-path: classpath:data/AU_College_Transport_2026-2027-1.xls
    json-path: classpath:data/transport_data.json

  payment:
    provider: ${PAYMENT_PROVIDER:razorpay}
    key: ${PAYMENT_PROVIDER_KEY:}
    secret: ${PAYMENT_PROVIDER_SECRET:}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}

  push:
    vapid-subject: ${PUSH_VAPID_SUBJECT:mailto:admin@anuraguniversity.edu.in}
    vapid-public-key: ${PUSH_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${PUSH_VAPID_PRIVATE_KEY:}

  ocr:
    enabled: ${OCR_ENABLED:false}
    api-key: ${OCR_API_KEY:}
    endpoint: ${OCR_ENDPOINT:}

  llm:
    enabled: ${LLM_ENABLED:false}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:gpt-4}
    endpoint: ${LLM_ENDPOINT:}

  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}

# ==============================================================================
# 9. Production Logging
# ==============================================================================
logging:
  level:
    root: INFO
    com.anuraguniversity.smartroute: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# ==============================================================================
# 10. Development Profile
# ==============================================================================
---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

# ==============================================================================
# 11. Test Profile
# ==============================================================================
---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:tc:mysql:8.0:///smartroute_test
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: create-drop
  mail:
    host: localhost
    port: 1025
  flyway:
    enabled: false

smartroute:
  mail:
    host: localhost

# ==============================================================================
# 12. Production Profile
# ==============================================================================
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}